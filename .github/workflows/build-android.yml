name: build-android

# Builds an unsigned debug APK for the Expo app in apps/mobile. GitHub Actions is the only place
# this repo builds; nothing is published or signed here and no secrets are used.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/chat-ui/**"
      - "packages/contracts/**"
      - "packages/core/**"
      - "packages/i18n/**"
      - "packages/logging/**"
      - "packages/ui-tokens/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".pnpmfile.cjs"
      - "patches/**"
      - ".github/workflows/build-android.yml"
  push:
    branches: [native]

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Show Java and Android SDK versions
        run: |
          set -euo pipefail
          java -version
          javac -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          # The Android SDK ships with the runner image; honour whatever it exported, and fall
          # back to the image's usual location.
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "Android SDK not found at $sdk" >&2
            ls -d /usr/local/lib/android* /opt/android* 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "Android SDK: $sdk"
          ls "$sdk"
          ls "$sdk/platforms" 2>/dev/null || true
          ls "$sdk/build-tools" 2>/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the native Android project
        run: |
          set -euo pipefail
          if [ -d apps/mobile/android ]; then
            echo "Using the committed apps/mobile/android project."
          else
            pnpm --filter @rakazo/mobile exec expo prebuild --platform android --no-install
          fi
          test -x apps/mobile/android/gradlew || chmod +x apps/mobile/android/gradlew
          test -f apps/mobile/android/gradlew

      - name: Build the debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check the APK
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: rakazo-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
