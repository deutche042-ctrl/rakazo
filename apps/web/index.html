<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Your team of always-on agents." />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rakazo" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="128x128" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Rakazo</title>
    <!-- The page paints before the stylesheet loads, so keep it on the app's own background. -->
    <style>
      html,
      body {
        background: #0a0a0a;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #fff;
      }
    </style>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root">
      <div
        aria-hidden="true"
        style="display: grid; min-height: 100vh; place-items: center; color: #737373"
      >
        <span
          style="width: 10px; height: 10px; border-radius: 9999px; background: currentColor"
        ></span>
      </div>
    </div>
    <noscript>
      <p style="margin: 4rem auto; max-width: 32rem; text-align: center; color: #737373">
        Rakazo needs JavaScript turned on.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
